[tool.briefcase]
project_name = "Nika"
bundle = "org.nikaassistant"
version = "2.1.0"
url = "https://github.com/nika-assistant"
author = "Nika"
author_email = "nika@example.invalid"

[tool.briefcase.app.nika]
formal_name = "Nika"
description = "Голосовой ассистент: звонки, приложения, таймеры, вайфай и живой разговор"
long_description = """
Nika — голосовой ассистент для телефона на BeeWare (Toga + Briefcase).
"""
icon = "assets/icon"
sources = ["src/nika"]
test_sources = ["tests"]
requires = ["toga"]

[tool.briefcase.app.nika.android]
requires = ["toga-android", "certifi"]

# Используй формат "permission.название_разрешения = "описание""
permission.internet = "Для работы сети"
permission.access_network_state = "Для проверки сети"
permission.access_wifi_state = "Для работы с Wi-Fi"
permission.change_wifi_state = "Для управления Wi-Fi"
permission.access_fine_location = "Для определения местоположения"
permission.access_coarse_location = "Для определения местоположения"
permission.call_phone = "Для совершения звонков"
permission.read_contacts = "Для доступа к контактам"
permission.send_sms = "Для отправки SMS"
permission.record_audio = "Для голосового ввода"
permission.camera = "Для работы камеры"
permission.post_notifications = "Для уведомлений"
permission.vibrate = "Для вибрации"
permission.query_all_packages = "Для запуска приложений"
permission.foreground_service = "Для фоновых задач"

[tool.briefcase.app.nika.windows]
requires = ["toga-winforms"]

[tool.briefcase.app.nika.macOS]
requires = ["toga-cocoa"]

[tool.briefcase.app.nika.linux]
requires = ["toga-gtk"]

[tool.briefcase.app.nika.iOS]
requires = ["toga-iOS"]
