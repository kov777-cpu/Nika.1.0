name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build for Android
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Increase swap space
        run: |
          sudo fallocate -l 10G /mnt/big-swapfile
          sudo chmod 600 /mnt/big-swapfile
          sudo mkswap /mnt/big-swapfile
          sudo swapon /mnt/big-swapfile
          swapon --show

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Create local recipe for charset_normalizer
        run: |
          mkdir -p p4a-recipes/charset_normalizer
          cat > p4a-recipes/charset_normalizer/__init__.py << 'EOF'
          from pythonforandroid.recipe import PythonRecipe

          class CharsetNormalizerRecipe(PythonRecipe):
              version = '3.3.2'
              url = 'https://files.pythonhosted.org/packages/source/c/charset-normalizer/charset_normalizer-{version}.tar.gz'
              depends = ['setuptools']
              call_hostpython_via_targetpython = False
              site_packages_name = 'charset_normalizer'

          recipe = CharsetNormalizerRecipe()
          EOF

      - name: Point buildozer to local recipes (absolute path)
        run: |
          sed -i '/^p4a.local_recipes/d' buildozer.spec
          echo "p4a.local_recipes = /home/runner/work/Nika/Nika/p4a-recipes" >> buildozer.spec
          grep "p4a.local_recipes" buildozer.spec

      - name: Ensure charset_normalizer is in requirements
        run: |
          # 确保 charset_normalizer 被显式列出，否则 p4a 可能不会去查找对应的 recipe
          # 注意：具体版本需要和 recipe 中的 version 保持一致
          sed -i 's/^requirements = .*/requirements = python3==3.13.9, hostpython3==3.13.9, kivy==2.3.1, pyjnius, android, certifi, charset_normalizer==3.3.2/' buildozer.spec
          grep "^requirements" buildozer.spec

      - name: Build with Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nika-apk
          path: bin/*.apk
