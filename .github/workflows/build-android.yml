name: Build Nika APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # Рекомендуемая версия для Briefcase

      - name: Install Briefcase
        run: |
          python -m pip install --upgrade pip
          pip install briefcase

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'  # Briefcase для Android требует JDK 17

      - name: Create Android project
        run: briefcase create android

      - name: Build Android APK
        run: briefcase build android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nika-apk
          path: build/nika/android/gradle/app/build/outputs/apk/debug/app-debug.apk
